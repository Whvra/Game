services:
  - type: web
    name: game-bot-backend
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO
    branch: main
    plan: free
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_DEFAULT_CHANNEL_ID
        sync: false
      - key: GAME_PLAY_URL
        value: https://game-bot-backend.onrender.com
    autoDeploy: true
